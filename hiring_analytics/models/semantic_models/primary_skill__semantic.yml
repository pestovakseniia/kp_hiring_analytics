semantic_models:
  - name: primary_skills
    description: >
      Reference dimension containing technical and business skills
      used for candidate and employee classification.

    model: ref('dim_primary_skill')

    entities:
      - name: primary_skill
        expr: id
        type: primary

    dimensions:
      - name: primary_skill_name
        expr: name
        description: Name of the skill
        type: categorical

      - name: type
        description: Skill classification type
        type: categorical

      - name: is_active
        description: Indicates whether the skill is active
        type: categorical

      - name: url
        description: Reference URL associated with the skill
        type: categorical