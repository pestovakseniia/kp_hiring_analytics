semantic_models:
  - name: primary_skills
    description: >
      Reference dimension containing technical and business skills
      used for candidate and employee classification.

    model: ref('dim_primary_skill')

    entities:
      - name: primary_skill
        expr: id
        type: primary

    dimensions:
      - name: name
        description: Name of the skill
        type: categorical

      - name: type
        description: Skill classification type
        type: categorical

      - name: is_active
        description: Indicates whether the skill is active
        type: categorical

      - name: url
        description: Reference URL associated with the skill
        type: categorical

    measures:
      - name: skill_count
        description: Total number of skills
        agg: count

      - name: active_skill_count
        description: Number of active skills
        agg: sum
        expr: case when is_active = true then 1 else 0 end

      - name: inactive_skill_count
        description: Number of inactive skills
        agg: sum
        expr: case when is_active = false then 1 else 0 end