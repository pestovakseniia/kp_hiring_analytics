semantic_models:
  - name: dates
    description: >
      Calendar date dimension used for time-based reporting,
      aggregations, and business calendar analysis.

    model: ref('dim_date')

    entities:
      - name: date
        type: primary

    dimensions:
      - name: date_value
        expr: date
        type: time
        type_params:
          time_granularity: day

      # categorical dims
      - name: year_of_date
        expr: year
        type: categorical

      - name: quarter_of_date
        expr: quarter
        type: categorical

      - name: month_of_date
        expr: month
        type: categorical

      - name: week_of_date
        expr: week
        type: categorical

      - name: day_of_date
        expr: day
        type: categorical

      - name: day_of_week
        type: categorical

      - name: day_name
        type: categorical

      - name: month_name
        type: categorical

      # boolean dimensions
      - name: is_weekend
        type: categorical

      - name: is_holiday
        type: categorical

    measures:
      - name: holiday_count
        description: Number of holidays
        agg: sum
        expr: case when is_holiday = true then 1 else 0 end
        agg_time_dimension: date_value

      - name: weekend_day_count
        description: Number of weekend days
        agg: sum
        expr: case when is_weekend = true then 1 else 0 end
        agg_time_dimension: date_value